services:
  telegram-stremio:
    build: .
    container_name: tg_stremio
    ports:
      - "8000:8000"
    volumes:
      - ./config.env:/app/config.env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: stremio-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    network_mode: "service:telegram-stremio"     
